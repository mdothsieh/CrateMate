<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy: the page may only load its own bundled code.
      'unsafe-inline' for styles is required by Tailwind/Vite style injection;
      scripts stay strictly self-only. No remote origins, ever — this app is
      local-first by design (PLAN.md → "local-only, you own your data").
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrateMate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
